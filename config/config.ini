[[Settings]
# 啟用設定與結果輸出
open_update = True
open_use_cache = True
open_request = True
open_filter_speed = False
open_filter_resolution = False
open_url = True
open_epg = True

# 輸出檔案路徑（對應 GitHub Pages）
source_file = config/user_demo.txt
final_file = output/user_result.txt
m3u_file = output/user_result.m3u

# 網路連線與並發設定
request_timeout = 10
urls_limit = 15
speed_test_limit = 5
ipv_type = all

# 啟用線上訂閱來源抓取（關閉用不到的酒店源與組播源以加快速度）
open_subscribe = True
open_hotel = False
open_multicast = False
open_online_search = False

# 台灣與繁中公開直播源（可依需求自行增減網址）
subscribe_urls = 
    https://githubusercontent.com
    https://githubusercontent.com
    https://githubusercontent.com

# 台灣與繁體中文 EPG 節目單（讓 APTV 顯示節目預告）
epg_urls = 
    https://epg.pw
    https://githubusercontent.com

# 頻道名稱標準化與關鍵字過濾（排除購物台與無效廣告）
open_sort = True
black_list = 購物,廣告,測試,MOMO,東森購物,ViVa
white_list = 台視,中視,華視,民視,公視,TVBS,三立,東森,年代,壹電視,非凡,八大,緯來,中天,客家,原住民族,寰宇
